<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portafolio de Laura Delgado – Diseñadora Multimedia" />
  <title>Inicio — Portafolio Laura Delgado</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ====================================================
       NAVEGACIÓN PRINCIPAL (compartida en todas las páginas)
  ==================================================== -->
  <nav class="site-nav" role="navigation" aria-label="Navegación principal">
    <div class="nav-inner">
      <a href="index.html" class="nav-tab">Inicio</a>
      <a href="sobre-mi.html" class="nav-tab">Sobre mí</a>
      <a href="proyectos.html" class="nav-tab">Proyectos</a>
      <a href="contacto.html" class="nav-tab">Contacto</a>
    </div>
  </nav>
  <!-- Línea decorativa bajo nav — efecto carpeta -->
  <div class="nav-underline" aria-hidden="true"></div>

  <!-- ====================================================
       PÁGINA: INICIO
       Wireframe: fondo navy oscuro, título "Portafolio"
       en script grande, sello "2026" y deco flotantes
  ==================================================== -->
  <main class="inicio-wrapper" style="margin-top:62px; min-height:calc(100vh - 62px);">

    <div class="inicio-card fade-in">

      <!-- Sello decorativo estilo correo -->
      <div class="stamp" aria-hidden="true">
        2026
        <div class="stamp-pin"></div>
      </div>

      <!-- ── Decoraciones flotantes ──
           Reproducen los pequeños iconos del wireframe:
           etiqueta, cámara, laptop, estrellas, espirales   -->
      <!-- Decoraciones flotantes -->

      <img src="Imagenes/brillo1.png" class="deco deco1" alt="" aria-hidden="true">

      <img src="Imagenes/brillo2.png" class="deco deco2" alt="" aria-hidden="true">

      <img src="Imagenes/camara.png" class="deco deco3" alt="" aria-hidden="true">

      <img src="Imagenes/compu.png" class="deco deco4" alt="" aria-hidden="true">

      <img src="Imagenes/garabato.png" class="deco deco5" alt="" aria-hidden="true">

      <img src="Imagenes/tableta.png" class="deco deco6" alt="" aria-hidden="true">

      <!-- TÍTULO PRINCIPAL -->
      <h1 class="inicio-title">Portafolio</h1>
      <p class="inicio-subtitle">Laura Delgado</p>

    </div>

  </main>

  <script src="js/main.js"></script>
</body>

</html>
